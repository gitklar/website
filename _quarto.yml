# Course website of gitklar. One site, one snapshot per cohort
# (gitklar-dev/admin, docs/decisions/0001).
#
#   quarto render                                    root, into _site/
#   quarto render --profile cohort,airetreat-01  cohort, into _site/airetreat-01/
#
# A cohort is the profile file _quarto-<name>.yml plus one line in the file
# `cohorts`. Shared pages are never edited for one cohort: cohort-specific
# text lives in the profile values and in blocks marked when-profile.

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "vorbereitung/*.qmd"

lang: de

website:
  title: "gitklar"
  description: "Git und GitHub für Menschen, die mit KI arbeiten. Ein Kurs von bitz."
  site-url: https://gitklar.ch/
  repo-url: https://github.com/gitklar/website
  favicon: assets/avatar.png
  navbar:
    logo: logos/wordmark-dark.svg
    logo-alt: "bitz"
    left:
      - href: index.qmd
        text: Start
      - href: vorbereitung/index.qmd
        text: Vorbereitung
      - href: werkzeuge.qmd
        text: Nachschlagen
    right:
      - icon: github
        href: https://github.com/gitklar
        aria-label: GitHub
  sidebar:
    - id: vorbereitung
      logo: false
      title: Vorbereitung
      style: docked
      collapse-level: 2
      contents:
        - vorbereitung/index.qmd
        - section: "Zuerst"
          contents:
            - vorbereitung/einladung.qmd
            - vorbereitung/lesezeichen.qmd
            - vorbereitung/konto.qmd
        - section: "Im Browser"
          contents:
            - vorbereitung/repository-anlegen.qmd
            - vorbereitung/rezept-dokumentieren.qmd
        - section: "Auf dem Laptop"
          contents:
            - vorbereitung/github-desktop-macos.qmd
            - vorbereitung/github-desktop-windows.qmd
            - vorbereitung/klonen.qmd
            - vorbereitung/erster-commit.qmd
        - section: "Freiwillig"
          contents:
            - vorbereitung/claude-code.qmd
            - vorbereitung/editor.qmd
        - section: "Workshop verpasst?"
          contents:
            - rezept-einreichen.qmd
        - section: "Nachschlagen"
          contents:
            - werkzeuge.qmd
            - ki-werkzeuge.qmd
            - glossar.qmd
            - begriffe.qmd
  page-footer:
    left: "gitklar von bitz. Lars Schöbitz GmbH, Zürich. Kontakt: lars@lse.de"
    right: "[Quellcode](https://github.com/gitklar/website)"

# Default cohort values. A cohort profile overrides them.
cohort:
  name: ""
  label: ""
  session_1: "noch offen"
  session_2: "noch offen"
  due_date: "noch offen"
  hosts: "Lars Schöbitz"

format:
  html:
    theme: [cosmo, brand, gitklar.scss]
    css: styles.css
    toc: true
    toc-title: "Auf dieser Seite"
    link-external-newwindow: true
    smooth-scroll: true
    # A click opens a screenshot large; the copy button on a code block is
    # always visible, so the recipe template can be copied in one click.
    lightbox: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      # Plausible analytics, no cookies
      - text: |
          <script defer data-domain="gitklar.ch" src="https://plausible.io/js/script.js"></script>
