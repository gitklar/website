# Die Begriffe des Kurses, eine Datei für drei Orte: das Glossar (glossar.qmd,
# {{< glossar liste >}}), die Tabelle Englisch und Deutsch (begriffe.qmd,
# {{< glossar tabelle >}}) und die Erklärung beim Darüberfahren auf jeder Seite
# ({{< gl commit >}}). Die Shortcodes liegen in _extensions/ghe/gl.
#
# Felder je Begriff:
#   term        englisches Stichwort, so wie es auf dem Bildschirm steht
#   aliases     weitere Schreibweisen, die {{< gl ... >}} auf den Begriff führen
#   gruppe      Abschnitt auf den Seiten: Git und GitHub, Dateien, Knöpfe und Fenster,
#               Werkzeuge, KI und Agenten
#   uebersetzt  so kann eine Browser-Übersetzung oder ein deutsches System es zeigen
#   kurz        Bedeutung in wenigen Worten, für die Tabelle
#   bedeutung   die Erklärung in Alltagssprache, für Glossar und Popover
#   wo          wo der Begriff im Kurs auf dem Bildschirm vorkommt
#   befehl      der Befehl im Terminal, der dahintersteckt
#   seite       die Seite der Vorbereitung, die den Schritt erklärt
#   bild        Schlüssel (key) eines Bildschirms aus der Liste `bildschirme`
#               unten: der Screenshot, auf dem der Begriff zu sehen ist
#
# Die zweite Liste, `bildschirme`, sind die Screenshots: je ein Eintrag mit
#   key          Schlüssel, auf den `bild` verweist (Anker #bild-<key>)
#   titel        Überschrift des Bildschirms
#   seite        die Seite, auf der er erscheint (begriffe.html, ki-werkzeuge.html)
#   beschreibung was der Screenshot zeigen soll
#   datei        die Bilddatei, relativ zum Projekt; ohne Angabe bilder/<key>.png
# Fehlt die Datei, zeigt die Seite einen markierten Platzhalter.
# {{< glossar bildschirme >}} rendert alle Bildschirme einer Seite,
# {{< glossar bild <key> >}} einen einzelnen an beliebiger Stelle.
#
# Alle Werte in Anführungszeichen. Markdown darin ist erlaubt (`code`, **fett**).

begriffe:

  # Git und GitHub ----------------------------------------------------------

  - term: "Branch"
    aliases: ["Branches", "Zweig"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Zweig», «Filiale», manchmal «Branch»"
    kurz: "eigene Arbeitslinie im Repository"
    bedeutung: "Ein Branch ist eine eigene Arbeitslinie innerhalb eines Repositorys. Du legst einen Branch an, wenn du Dateien ändern willst, ohne die Hauptfassung des Projekts anzufassen. Sind die Änderungen geprüft, führst du sie in die Hauptfassung zurück. In der Vorbereitung arbeitest du nur auf `main`. Im Workshop 1 legst du im Kochbuch deinen ersten eigenen Branch an, zum Beispiel `rezept-linsensuppe`."
    seite: "[Rezept per Pull request einreichen](rezept-einreichen.html)"
    wo: "GitHub Desktop, Knopf **Current branch** oben in der Mitte; auf github.com die Auswahl links über der Dateiliste"
    befehl: "`git branch`, `git switch`"
    bild: "desktop-oben"

  - term: "Clone"
    aliases: ["klonen", "Clone repository"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Klonen», «Repository klonen»"
    kurz: "vollständige Kopie auf deinem Laptop anlegen"
    bedeutung: "Klonen heisst, eine vollständige Kopie eines Repositorys von GitHub auf deinen Laptop zu holen, samt der Geschichte aller Änderungen und der Verbindung zurück zu GitHub. Du klonst einmal, danach arbeitest du in diesem Ordner."
    wo: "GitHub Desktop, Menü **File**, **Clone Repository**; auf github.com der grüne Knopf **Code**"
    befehl: "`git clone`"
    seite: "[Dein Repository klonen](vorbereitung/klonen.html)"
    bild: "desktop-klonen"

  - term: "Commit"
    aliases: ["Commits", "committen"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Commit», «Festschreiben», «Übernehmen», «Bestätigen»"
    kurz: "gespeicherte Fassung deiner Dateien mit einer Nachricht"
    bedeutung: "Ein Commit ist eine gespeicherte Fassung deines Projekts. Beim Commit hält Git den genauen Inhalt deiner Dateien in diesem Moment fest, zusammen mit einer Nachricht, die sagt, was du geändert hast und warum. Du kannst jederzeit zu jedem früheren Commit zurück."
    wo: "GitHub Desktop, Knopf **Commit to main** unten links; auf github.com der Knopf **Commit changes** beim Bearbeiten einer Datei"
    befehl: "`git commit -m \"Nachricht\"`"
    seite: "[Commit und Push vom Laptop](vorbereitung/erster-commit.html)"
    bild: "desktop-changes"

  - term: "Commit message"
    aliases: ["Commit-Nachricht", "Summary"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Zusammenfassung» (Summary) und «Beschreibung» (Description)"
    kurz: "die Nachricht zum Commit"
    bedeutung: "Die Commit-Nachricht ist die kurze Notiz zu einem Commit. Sie sagt dir selbst und anderen später, was du geändert hast und warum. In GitHub Desktop schreibst du sie ins Feld **Summary**. Das Feld **Description** darunter ist für längere Erklärungen und darf leer bleiben."
    wo: "GitHub Desktop, Felder **Summary** und **Description** unten links"
    befehl: "der Text hinter `-m`"
    bild: "desktop-changes"

  - term: "Diff"
    aliases: ["Diffs"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Diff», «Unterschied»"
    kurz: "was sich Zeile für Zeile geändert hat"
    bedeutung: "Ein Diff zeigt, was sich zwischen zwei Fassungen einer Datei geändert hat, Zeile für Zeile. Entfernte Zeilen sind rot und tragen ein Minus, neue Zeilen sind grün und tragen ein Plus. Im Diff prüfst du, was du oder eine KI geändert hat, bevor du es behältst."
    wo: "GitHub Desktop, rechte Hälfte im Reiter **Changes**; auf github.com der Reiter **Files changed** eines Pull requests"
    befehl: "`git diff`"
    bild: "desktop-changes"

  - term: "Fork"
    aliases: ["Forks", "forken"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Gabel», «Abspaltung», «Fork»"
    kurz: "eigene Kopie eines fremden Repositorys in deinem Konto"
    bedeutung: "Ein Fork ist eine eigene Kopie des Repositorys einer anderen Person, gespeichert in deinem GitHub-Konto. Du kannst deinen Fork frei ändern und deine Änderungen dem Original über einen Pull request anbieten. Im Kurs brauchst du keinen Fork: Im Kochbuch legst du deinen Branch direkt im gemeinsamen Repository an."
    wo: "github.com, Knopf **Fork** rechts oben in einem Repository"
    bild: "github-repository"

  - term: "History"
    aliases: ["Geschichte", "Verlauf"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Verlauf», «Geschichte», «Historie»"
    kurz: "alle Commits der Reihe nach"
    bedeutung: "Die History ist die Liste aller Commits eines Repositorys, vom ersten bis zum neuesten. Sie zeigt, wer wann was geändert hat und warum. Jede Kopie des Repositorys enthält die ganze History. Deshalb kannst du jede frühere Fassung wiederherstellen."
    wo: "GitHub Desktop, Reiter **History** links; auf github.com der Link **commits** oben in der Dateiliste"
    befehl: "`git log`"
    bild: "desktop-history"

  - term: "Issue"
    aliases: ["Issues"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Problem», «Ausgabe», «Anliegen», «Ticket»"
    kurz: "Aufgabe, Frage oder Fehler, festgehalten im Repository"
    bedeutung: "Ein Issue ist ein Eintrag auf der GitHub-Seite eines Repositorys für eine Aufgabe, eine Frage oder einen Fehler. Jedes Issue hat eine Nummer, kann einer Person zugewiesen werden und bleibt offen, bis jemand es schliesst. Dein Fahrplan für die Vorbereitung ist ein Issue im Repository `gitklar/vorbereitung`, und am Ende schreibst du einen Kommentar hinein."
    wo: "github.com, Reiter **Issues**, Knopf **New issue**"
    seite: "[Fertig melden](vorbereitung/fertig.html)"
    bild: "github-issue"

  - term: "main"
    aliases: ["Hauptzweig", "default branch"]
    gruppe: "Git und GitHub"
    uebersetzt: "bleibt meist «main», selten «Haupt»"
    kurz: "der Hauptzweig eines Repositorys"
    bedeutung: "`main` ist der Hauptzweig eines Repositorys, die Fassung, die immer funktionieren soll. In der Vorbereitung committest du direkt auf `main`. Im Kurs lernst du, Änderungen auf einem eigenen Branch zu machen und über einen Pull request nach `main` zu bringen. Ältere Projekte nennen diesen Branch `master`."
    wo: "GitHub Desktop, Knopf **Commit to main**; **Current branch** zeigt **main**"
    bild: "desktop-oben"

  - term: "Merge"
    aliases: ["mergen", "Merges"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Zusammenführen», «Verschmelzen», «Einbinden»"
    kurz: "Änderungen eines Branches in einen anderen übernehmen"
    bedeutung: "Mergen heisst, die Änderungen eines Branches in einen anderen zu übernehmen, so dass ein Branch danach die Arbeit beider enthält. Im Kurs passiert der Merge, wenn jemand einen Pull request auf GitHub annimmt."
    wo: "github.com, Knopf **Merge pull request**"
    befehl: "`git merge`"
    bild: "github-pull-request"

  - term: "Merge conflict"
    aliases: ["Konflikt", "Merge-Konflikt"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Zusammenführungskonflikt», «Merge-Konflikt»"
    kurz: "zwei Fassungen derselben Zeilen, Git fragt dich"
    bedeutung: "Ein Merge conflict entsteht, wenn zwei Branches dieselben Zeilen derselben Datei verschieden geändert haben und Git nicht wissen kann, welche Fassung du willst. Git hält an, markiert beide Fassungen in der Datei und wartet, bis du dich entscheidest. Das ist kein Fehler. Git rät nur nicht. Im Workshop 2 entsteht einer, wenn alle ihre Zeile ans Ende von `inhalt.csv` im Kochbuch schreiben."
    wo: "GitHub Desktop, Hinweisfenster beim Mergen; auf github.com der Knopf **Resolve conflicts**"
    bild: "github-pull-request"

  - term: "Organization"
    aliases: ["Organisation", "Organizations"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Organisation»"
    kurz: "gemeinsamer Bereich auf GitHub, hier gitklar"
    bedeutung: "Eine Organization ist ein gemeinsamer Bereich auf GitHub, in dem Repositories mehreren Personen gehören. gitklar ist eine. Deine Einladung bringt dich hinein. Dort liegen dein eigenes Repository `rezept-dein-benutzername`, dein Issue in `vorbereitung` und das gemeinsame Kochbuch."
    wo: "github.com/gitklar; die Einladung kommt per E-Mail mit dem Knopf **Join gitklar**"
    seite: "[Einladung annehmen](vorbereitung/einladung.html)"
    bild: "github-einladung"

  - term: "origin"
    gruppe: "Git und GitHub"
    uebersetzt: "«Ursprung», «Herkunft»"
    kurz: "der Name der Kopie auf GitHub"
    bedeutung: "`origin` ist der Name, den dein Repository auf dem Laptop für seine Kopie auf GitHub benutzt, ein Lesezeichen statt der langen Adresse. Beim Klonen vergibt Git den Namen von selbst. Deshalb heissen die Knöpfe **Push origin** und **Fetch origin**."
    wo: "GitHub Desktop, in **Push origin** und **Fetch origin**"
    befehl: "`git remote -v`"
    bild: "desktop-oben"

  - term: "Pull"
    aliases: ["Pull origin", "Fetch", "Fetch origin"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Ziehen», «Abrufen» (Fetch), «Pull»"
    kurz: "neue Commits von GitHub auf deinen Laptop holen"
    bedeutung: "Pull holt neue Commits von GitHub in deine Kopie auf dem Laptop. GitHub Desktop macht es in zwei Schritten: **Fetch origin** schaut nach, ob es auf GitHub Neues gibt, und wird zu **Pull origin**, wenn ja. Arbeitest du allein an einem Repository, gibt es selten etwas zu holen."
    wo: "GitHub Desktop, Knopf **Fetch origin** oder **Pull origin** oben rechts"
    befehl: "`git fetch`, `git pull`"
    bild: "desktop-oben"

  - term: "Pull request"
    aliases: ["Pull requests", "PR"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Pull-Anfrage», «Pull-Request», «Zugriffsanfrage», «Abrufanforderung»"
    kurz: "die Bitte, einen Branch zu prüfen und zu übernehmen"
    bedeutung: "Ein Pull request ist die Bitte auf GitHub, die Änderungen eines Branches zu prüfen und in einen anderen Branch zu übernehmen, meist nach `main`. Die prüfende Person liest das Diff, kommentiert und merged am Ende. Mit Pull hat er trotz des Namens nichts zu tun: Pull ist ein Datentransfer, ein Pull request ist ein Gespräch, und es gibt ihn nur auf GitHub, nicht in Git."
    wo: "github.com, Reiter **Pull requests**, Knopf **Compare & pull request**; GitHub Desktop, Menü **Branch**, **Create pull request**"
    bild: "github-pull-request"

  - term: "Push"
    aliases: ["Push origin", "pushen"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Pushen», «Drücken», «Schieben», «Hochladen»"
    kurz: "deine Commits nach GitHub kopieren"
    bedeutung: "Push kopiert deine Commits vom Laptop nach GitHub. Bis du pushst, sieht niemand sonst deine Commits, und GitHub hat keine Sicherung davon. Deshalb gehören Commit und Push zusammen: Commit sichert auf dem Laptop, Push sichert auf GitHub."
    wo: "GitHub Desktop, Knopf **Push origin** oben rechts"
    befehl: "`git push`"
    seite: "[Commit und Push vom Laptop](vorbereitung/erster-commit.html)"
    bild: "desktop-oben"

  - term: "Review"
    aliases: ["Reviews", "Request changes", "Approve", "Code review"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Überprüfung», «Rezension», «Änderungen anfordern» (Request changes), «Genehmigen» (Approve)"
    kurz: "einen Pull request lesen, kommentieren und beurteilen"
    bedeutung: "Ein Review ist das Lesen eines Pull requests durch eine andere Person. Sie schaut sich im Reiter **Files changed** jede geänderte Zeile an, kann zu einzelnen Zeilen Kommentare schreiben und schliesst mit einem Urteil ab: **Comment** für eine Bemerkung, **Request changes** für die Bitte um Änderungen, **Approve** für ein Ja. Wer um Änderungen gebeten wird, ändert auf demselben Branch weiter. Der Pull request zeigt die neuen Commits von selbst."
    wo: "github.com, Pull request, Reiter **Files changed**, Knopf **Review changes**"
    seite: "[Rezept per Pull request einreichen](rezept-einreichen.html)"
    bild: "github-pull-request"

  - term: "README"
    gruppe: "Git und GitHub"
    uebersetzt: "«LIESMICH», «README»"
    kurz: "die Startseite eines Repositorys"
    bedeutung: "Die README ist eine Textdatei, `README.md`, die erklärt, was ein Repository enthält und wie man es benutzt. GitHub zeigt sie unter der Dateiliste an. Deshalb ist sie das Erste, was Besucher:innen lesen. Deine erste schreibst du beim Anlegen deines Repositorys, im Browser."
    wo: "github.com, unter der Dateiliste eines Repositorys; in deinem Ordner als Datei `README.md`"
    seite: "[Dein Repository anlegen](vorbereitung/repository-anlegen.html)"
    bild: "github-repository"

  - term: "Repository"
    aliases: ["Repositories", "Repositorys", "Repo"]
    gruppe: "Git und GitHub"
    uebersetzt: "bleibt meist «Repository», manchmal «Ablage», «Aufbewahrungsort» oder «Speicher»"
    kurz: "ein Projektordner mit seiner ganzen Geschichte"
    bedeutung: "Ein Repository ist ein Ordner, dessen Geschichte Git festhält: alle Dateien und jeder Commit, der je gemacht wurde. Meist ist ein Projekt ein Repository. Dein Repository `rezept-dein-benutzername` liegt nach dem Klonen zweimal vor, einmal auf deinem Laptop und einmal auf GitHub."
    seite: "[Dein Repository anlegen](vorbereitung/repository-anlegen.html)"
    wo: "GitHub Desktop, oben links **Current repository**; auf github.com die Seite eines Repositorys, Reiter **Code**"
    bild: "github-repository"

  - term: "Stage"
    aliases: ["staging", "staged", "stagen"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Inszenieren», «Bereitstellen», «Vormerken»"
    kurz: "eine Datei für den nächsten Commit vormerken"
    bedeutung: "Vor dem Commit wählst du, welche geänderten Dateien hineinkommen. Das heisst stagen. In GitHub Desktop ist das Häkchen vor jeder Datei im Reiter **Changes**: Häkchen gesetzt, die Datei kommt in den Commit. Im Terminal ist es ein eigener Befehl."
    wo: "GitHub Desktop, Häkchen vor den Dateien im Reiter **Changes**"
    befehl: "`git add`"
    bild: "desktop-changes"

  - term: "Version control"
    aliases: ["Versionskontrolle", "Versionsverwaltung"]
    gruppe: "Git und GitHub"
    uebersetzt: "«Versionskontrolle», «Versionsverwaltung»"
    kurz: "Fassungen festhalten und zurückholen können"
    bedeutung: "Versionskontrolle heisst, die Fassungen deiner Dateien so festzuhalten, dass du jede frühere Fassung wiederfindest und siehst, was sich zwischen zwei Fassungen geändert hat. Git ist ein Programm dafür."

  # Dateien -----------------------------------------------------------------

  - term: "CSV"
    aliases: ["csv", "CSV-Datei", "zutaten.csv"]
    gruppe: "Dateien"
    uebersetzt: "«CSV», «kommagetrennte Werte»"
    kurz: "eine Tabelle als reiner Text, Spalten durch Kommas getrennt"
    bedeutung: "Eine CSV-Datei ist eine Tabelle als reiner Text. Jede Zeile der Datei ist eine Zeile der Tabelle, und Kommas trennen die Spalten. Die erste Zeile nennt die Spalten. GitHub zeigt eine CSV-Datei als Tabelle an. Weil sie reiner Text ist, kann Git bei jeder Fassung zeigen, welche Zeile sich geändert hat. Öffne sie zum Bearbeiten mit einem Textprogramm. Excel und Numbers können beim Speichern die Kommas durch Strichpunkte ersetzen."
    wo: "in deinem Repository als `rezept/zutaten.csv`; im Kochbuch als `inhalt.csv`"
    seite: "[Dein Rezept aufschreiben](vorbereitung/rezept-dokumentieren.html)"
    bild: "github-csv-tabelle"

  - term: "Markdown"
    aliases: [".md", "Markdown-Datei"]
    gruppe: "Dateien"
    kurz: "reiner Text mit ein paar Zeichen für Formatierung"
    bedeutung: "Markdown ist reiner Text mit ein paar Zeichen, die GitHub als Formatierung anzeigt: `#` am Zeilenanfang für eine Überschrift, `**fett**`, `-` für eine Liste, `![Beschreibung](foto.jpg)` für ein Bild. Dateien mit der Endung `.md` sind Markdown, auch die README. Beim Bearbeiten im Browser zeigt der Reiter **Preview**, wie GitHub die Datei anzeigen wird."
    wo: "in deinem Repository als `README.md` und `rezept/rezept.md`; auf github.com der Reiter **Preview** beim Bearbeiten"
    seite: "[Dein Repository anlegen](vorbereitung/repository-anlegen.html)"
    bild: "github-datei-bearbeiten"

  - term: "Location data"
    aliases: ["Ortsangaben", "Ortsinformationen", "GPS", "EXIF", "Metadaten"]
    gruppe: "Dateien"
    uebersetzt: "«Ortsinformationen», «Standort», «GPS», «EXIF-Daten»"
    kurz: "wo ein Foto aufgenommen wurde, versteckt in der Datei"
    bedeutung: "Ein Handy speichert in jedem Foto Zusatzangaben, die man nicht sieht: Datum, Gerät und oft den Ort der Aufnahme, auf wenige Meter genau. Diese Angaben heissen Metadaten oder EXIF. Lädst du ein Foto in ein Repository hoch, bleiben sie in der Datei. Deshalb entfernst du die Ortsangaben vorher, auf macOS in Vorschau oder beim Export aus Fotos, auf Windows in den Eigenschaften der Datei."
    wo: "macOS: Vorschau, **Werkzeuge**, **Informationen einblenden**, Reiter GPS; Windows: Rechtsklick, **Eigenschaften**, Reiter **Details**"
    seite: "[Dein Rezept aufschreiben](vorbereitung/rezept-dokumentieren.html)"

  # Knöpfe und Fenster -------------------------------------------------------

  - term: "Authorize"
    aliases: ["Authorize desktop", "autorisieren"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Autorisieren», «Genehmigen»"
    kurz: "GitHub Desktop den Zugriff auf dein Konto erlauben"
    bedeutung: "Beim Anmelden in GitHub Desktop öffnet sich der Browser, und GitHub fragt, ob das Programm in deinem Namen arbeiten darf. **Authorize desktop** sagt ja. Danach kommt der Browser zurück zur App."
    wo: "Browser, während der Anmeldung in GitHub Desktop"
    seite: "[GitHub Desktop auf macOS](vorbereitung/github-desktop-macos.html) oder [auf Windows](vorbereitung/github-desktop-windows.html)"
    bild: "desktop-anmelden"

  - term: "Add file"
    aliases: ["Create new file", "Upload files"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Datei hinzufügen», «Neue Datei erstellen», «Dateien hochladen»"
    kurz: "auf github.com eine Datei anlegen oder hochladen"
    bedeutung: "**Add file** über der Dateiliste eines Repositorys öffnet zwei Wege: **Create new file** legt eine neue Textdatei an, **Upload files** lädt Dateien vom Laptop hoch, etwa Fotos. Schreibst du beim Anlegen einen Schrägstrich in den Namen, zum Beispiel `rezept/zutaten.csv`, entsteht dabei ein Ordner. Beides endet mit einem Commit."
    wo: "github.com, Repository, über der Dateiliste"
    seite: "[Dein Rezept aufschreiben](vorbereitung/rezept-dokumentieren.html)"
    bild: "github-datei-anlegen"

  - term: "Commit changes"
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Änderungen übernehmen», «Änderungen committen»"
    kurz: "im Browser speichern, und damit committen"
    bedeutung: "Auf github.com gibt es kein Speichern ohne Commit. **Commit changes** öffnet ein Fenster mit dem Feld **Commit message** für die Nachricht. Ein zweiter Klick auf **Commit changes** macht daraus einen Commit auf `main`, mit deinem Namen."
    wo: "github.com, beim Bearbeiten, Anlegen oder Hochladen einer Datei, rechts oben"
    seite: "[Dein Repository anlegen](vorbereitung/repository-anlegen.html)"
    bild: "github-datei-bearbeiten"

  - term: "Publish branch"
    aliases: ["Publish"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Branch veröffentlichen»"
    kurz: "einen neuen Branch zum ersten Mal nach GitHub schieben"
    bedeutung: "Ein neuer Branch existiert zuerst nur auf deinem Laptop. **Publish branch** schiebt ihn zum ersten Mal nach GitHub, mit allen Commits darauf. Danach heisst der Knopf wieder **Push origin**. Erst ein veröffentlichter Branch kann einen Pull request bekommen."
    wo: "GitHub Desktop, oben rechts, an der Stelle von **Push origin**"
    befehl: "`git push -u origin name`"
    seite: "[Rezept per Pull request einreichen](rezept-einreichen.html)"
    bild: "desktop-publish-branch"

  - term: "Changes"
    aliases: ["Änderungen"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Änderungen»"
    kurz: "was sich seit dem letzten Commit geändert hat"
    bedeutung: "Der Reiter **Changes** in GitHub Desktop zeigt links jede Datei, die sich seit dem letzten Commit geändert hat, und rechts das Diff der angeklickten Datei. Ist die Liste leer, gibt es nichts zu committen."
    wo: "GitHub Desktop, Reiter **Changes** oben links"
    befehl: "`git status`"
    bild: "desktop-changes"

  - term: "Code"
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Code»"
    kurz: "der grüne Knopf mit der Adresse zum Klonen"
    bedeutung: "Der grüne Knopf **Code** auf der GitHub-Seite eines Repositorys öffnet die Adresse zum Klonen und den Punkt **Open with GitHub Desktop**. Der Reiter **Code** daneben ist die Dateiliste."
    wo: "github.com, Repository, rechts über der Dateiliste"
    bild: "github-repository"

  - term: "Current repository"
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Aktuelles Repository»"
    kurz: "das Repository, das GitHub Desktop gerade zeigt"
    bedeutung: "GitHub Desktop zeigt immer ein Repository auf einmal. Welches, steht oben links unter **Current repository**. Ein Klick darauf öffnet die Liste aller Repositories auf deinem Laptop, die GitHub Desktop kennt."
    wo: "GitHub Desktop, oben links"
    bild: "desktop-oben"

  - term: "Local path"
    aliases: ["Local Path"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Lokaler Pfad»"
    kurz: "der Ordner auf deinem Laptop"
    bedeutung: "**Local Path** im Klon-Fenster ist der Ordner auf deinem Laptop, in den GitHub Desktop das Repository legt. Im Kurs ist das **Dokumente/gitrepos**. Der Knopf **Choose** öffnet das Ordnerfenster deines Systems, und das spricht Deutsch, auch wenn GitHub Desktop Englisch spricht."
    wo: "GitHub Desktop, Fenster **Clone Repository**"
    seite: "[Dein Repository klonen](vorbereitung/klonen.html)"
    bild: "desktop-klonen"

  - term: "Open in Terminal"
    aliases: ["Im Terminal öffnen"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Im Terminal öffnen», auf Windows «In der Eingabeaufforderung öffnen»"
    kurz: "die Kommandozeile im Repository öffnen"
    bedeutung: "**Open in Terminal** im Menü **Repository** öffnet ein Terminalfenster, das schon in deinem Repository steht. Dort tippst du Befehle wie `git status`. Im Workshop 1 machen wir das gemeinsam. In der Vorbereitung brauchst du es nicht."
    wo: "GitHub Desktop, Menü **Repository**"
    bild: "desktop-menue-repository"

  - term: "Visibility"
    aliases: ["Private", "Public", "privat", "öffentlich"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Sichtbarkeit», «Privat», «Öffentlich»"
    kurz: "wer ein Repository sehen kann"
    bedeutung: "Beim Anlegen eines Repositorys wählst du die Sichtbarkeit. **Public** heisst, jede Person im Internet kann es lesen. **Private** heisst, nur du und die Personen, denen du oder die Organisation Zugriff geben. In gitklar sind dein eigenes Repository, `vorbereitung` und das Kochbuch privat. Neben dem Namen eines Repositorys zeigt GitHub die Sichtbarkeit als kleines Schild."
    wo: "github.com, Seite **Create a new repository**; neben dem Namen jedes Repositorys"
    seite: "[Dein Repository anlegen](vorbereitung/repository-anlegen.html)"
    bild: "github-neues-repository"

  - term: "Settings"
    aliases: ["Options", "Preferences", "Einstellungen"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Einstellungen», «Optionen»"
    kurz: "die Einstellungen von GitHub Desktop"
    bedeutung: "Die Einstellungen von GitHub Desktop heissen auf macOS **Settings**, im Menü **GitHub Desktop**, und auf Windows **Options**, im Menü **File**. Dort steht unter **Accounts** deine Anmeldung und unter **Integrations** der Editor, den **Open in** benutzt."
    wo: "GitHub Desktop, Menü **GitHub Desktop** (macOS) oder **File** (Windows)"

  - term: "Show in Finder"
    aliases: ["Show in Explorer", "Im Finder anzeigen", "Im Explorer anzeigen"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Im Finder anzeigen», «Im Explorer anzeigen»"
    kurz: "den Ordner des Repositorys im Dateifenster öffnen"
    bedeutung: "**Show in Finder** auf macOS und **Show in Explorer** auf Windows öffnen den Ordner deines Repositorys im Dateifenster deines Systems. So findest du die Dateien, um sie mit einem Textprogramm zu öffnen."
    wo: "GitHub Desktop, Menü **Repository**"
    seite: "[Commit und Push vom Laptop](vorbereitung/erster-commit.html)"
    bild: "desktop-menue-repository"

  - term: "Sign in"
    aliases: ["Sign in to GitHub.com", "anmelden"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Anmelden», «Einloggen»"
    kurz: "GitHub Desktop mit deinem GitHub-Konto verbinden"
    bedeutung: "**Sign in to GitHub.com** verbindet GitHub Desktop mit deinem Konto. Die Anmeldung läuft im Browser, mit Benutzername und Passwort von github.com, und endet mit **Authorize desktop**."
    wo: "GitHub Desktop, beim ersten Start oder unter **Settings**, **Accounts**"
    bild: "desktop-anmelden"

  - term: "Source Control"
    aliases: ["Quellcodeverwaltung"]
    gruppe: "Knöpfe und Fenster"
    uebersetzt: "«Quellcodeverwaltung»"
    kurz: "die Git-Ansicht in VS Code und Positron"
    bedeutung: "**Source Control** ist die Git-Ansicht in Editoren wie VS Code und Positron: eine Seitenleiste mit den geänderten Dateien, einem Feld für die Commit-Nachricht und Knöpfen für Commit und Push. Jeder Knopf dort ist derselbe Git-Befehl wie in GitHub Desktop."
    wo: "VS Code oder Positron, Seitenleiste links, das Symbol mit den drei verbundenen Punkten"
    seite: "[Editor mit dem Repository verbinden](vorbereitung/editor.html)"
    bild: "editor-source-control"

  # Werkzeuge ---------------------------------------------------------------

  - term: "Claude Code"
    gruppe: "Werkzeuge"
    kurz: "KI-Agent, der Dateien liest, ändert und Git bedient"
    bedeutung: "Claude Code ist ein Programm von Anthropic, das in deinem Ordner arbeitet: Es liest Dateien, ändert sie, führt Befehle aus und bedient Git, alles auf eine Anweisung in Alltagssprache hin. Es gibt es als Teil der Claude-App und im Terminal. Im Kurs zeige ich es in Screencasts. Gelehrt wird es nicht."
    wo: "Claude-App, Reiter **Code**; oder im Terminal mit `claude`"
    seite: "[Claude Code im Repository starten](vorbereitung/claude-code.html)"
    bild: "claude-app-code"

  - term: "Editor"
    aliases: ["Editoren"]
    gruppe: "Werkzeuge"
    uebersetzt: "«Editor»; auf Windows heisst auch das Textprogramm des Systems Editor"
    kurz: "Programm zum Schreiben von Text und Code"
    bedeutung: "Ein Editor ist ein Programm, in dem du Text und Code schreibst, etwa VS Code oder Positron. Die meisten Editoren haben eine eigene Git-Ansicht. Im Kurs brauchst du keinen. Wer einen hat, verbindet ihn mit demselben Ordner."
    seite: "[Editor mit dem Repository verbinden](vorbereitung/editor.html)"

  - term: "Git"
    gruppe: "Werkzeuge"
    kurz: "das Programm auf deinem Laptop, das Fassungen festhält"
    bedeutung: "Git ist ein Programm auf deinem Laptop, das Änderungen an deinen Dateien festhält. Es speichert die Fassungen, die du ihm sagst, zeigt dir, was sich zwischen zwei Fassungen geändert hat, und bringt dich zu jeder früheren Fassung zurück. Git braucht kein Internet. GitHub Desktop bringt Git mit. Deshalb installierst du es nicht selbst."
    wo: "unsichtbar hinter jedem Knopf von GitHub Desktop"

  - term: "GitHub"
    gruppe: "Werkzeuge"
    kurz: "die Website, die eine Kopie deines Repositorys hält"
    bedeutung: "GitHub ist eine Website, github.com, die eine Kopie deines Repositorys im Internet hält, damit andere dein Projekt sehen, herunterladen und mit dir daran arbeiten können. GitHub fügt hinzu, was Git nicht hat: Issues, Pull requests, Organisationen. GitHub gehört Microsoft. Git gehört niemandem."
    wo: "im Browser"
    bild: "github-repository"

  - term: "GitHub Desktop"
    gruppe: "Werkzeuge"
    kurz: "das Programm mit den Knöpfen für Git"
    bedeutung: "GitHub Desktop ist ein Programm von GitHub für macOS und Windows, das die täglichen Git-Schritte als Knöpfe anbietet: klonen, Änderungen sehen, committen, pushen, Branches wechseln. Jeder Knopf ist ein Git-Befehl. Es bringt Git mit und spricht nur Englisch."
    seite: "[GitHub Desktop auf macOS](vorbereitung/github-desktop-macos.html) oder [auf Windows](vorbereitung/github-desktop-windows.html)"
    bild: "desktop-oben"

  - term: "Terminal"
    aliases: ["Kommandozeile", "Eingabeaufforderung"]
    gruppe: "Werkzeuge"
    uebersetzt: "«Terminal» auf macOS; «Eingabeaufforderung» oder «PowerShell» auf Windows"
    kurz: "das Fenster, in dem du Befehle tippst"
    bedeutung: "Das Terminal ist ein Fenster, in dem du Befehle als Text tippst, statt Knöpfe zu klicken. Jeder Knopf in GitHub Desktop hat dort einen Befehl, etwa `git push`. Es sieht karg aus und verzeiht keine Tippfehler. Claude Code lebt dort, und mit ihm wird aus dem Befehl wieder ein Satz. In der Vorbereitung brauchst du es nicht. Im Workshop 1 öffnen wir es einmal zusammen."
    bild: "claude-terminal"

  - term: "Claude Desktop"
    aliases: ["Claude-App", "Claude app"]
    gruppe: "Werkzeuge"
    kurz: "die Claude-App mit Chat, Cowork und dem Reiter Code"
    bedeutung: "Claude Desktop ist das Programm von Anthropic für macOS und Windows, im Kurs die Claude-App. Sie hat drei Arbeitsweisen: **Chat** für Fragen, **Cowork** für längere Aufgaben in einem Ordner, und den Reiter **Code**, in dem Claude Code steckt. Wer Claude Code in der App benutzt, braucht kein Terminal. Die drei sehen Verschiedenes von deinem Ordner; das erklärt [KI-Werkzeuge im Vergleich](ki-werkzeuge.html)."
    wo: "das Programm **Claude**; die Reiter oben in der Seitenleiste"
    bild: "claude-app-code"

  - term: "Cowork"
    gruppe: "Werkzeuge"
    uebersetzt: "zu prüfen: die Bezeichnung in der deutschen Claude-App"
    kurz: "Claude arbeitet in einem Ordner, ohne Terminal und ohne Git"
    bedeutung: "Cowork ist die Arbeitsweise der Claude-App für längere Aufgaben ohne Terminal. Du verbindest einen Ordner, und Claude liest und schreibt Dateien darin und führt Befehle in einer abgeschirmten Umgebung aus, laut Anthropic in der Cloud. Cowork kennt Dateien, nicht das Repository: Von Commits, Branches und Pull requests sagt die Dokumentation nichts. Was Cowork in deinem Ordner ändert, siehst du danach in GitHub Desktop unter **Changes** und committest es selbst."
    wo: "Claude-App, im Eingabefeld die Auswahl **Cowork**, dann einen Ordner verbinden; in der neuen Oberfläche entfällt die Auswahl"
    bild: "claude-app-cowork"

  - term: "Codex"
    aliases: ["Codex CLI", "Codex Cloud"]
    gruppe: "Werkzeuge"
    kurz: "der Coding-Agent von OpenAI, das Gegenstück zu Claude Code"
    bedeutung: "Codex ist der Coding-Agent von OpenAI, das Gegenstück zu Claude Code. Es gibt ihn als eigene Ansicht in der ChatGPT-App, als Befehl `codex` im Terminal, als Erweiterung für Editoren und als Codex Cloud auf Rechnern von OpenAI. Codex arbeitet mit Ordnern und Repositories: In der ChatGPT-App gibt es Knöpfe für Stage, Commit, Push und Pull request. Codex liest die Datei `AGENTS.md`, nicht `CLAUDE.md`."
    wo: "ChatGPT-App, Menü oben links, **Codex**; im Terminal `codex`"
    bild: "chatgpt-app-codex"

  - term: "ChatGPT Work"
    aliases: ["Work"]
    gruppe: "Werkzeuge"
    uebersetzt: "zu prüfen: wie die deutsche ChatGPT-Oberfläche den Umschalter nennt"
    kurz: "der Agent in ChatGPT für Recherche und Dokumente, nicht für Repositories"
    bedeutung: "Work ist der Agent in ChatGPT für längere Aufgaben mit fertigen Ergebnissen: Recherche, Dokumente, Tabellen, Präsentationen. Im Web und auf dem Handy läuft Work in der Cloud und kommt nicht an deine Dateien. In der ChatGPT-App kann Work mit deiner Erlaubnis lokale Ordner und Programme benutzen. Für Repositories ist in ChatGPT Codex zuständig, nicht Work."
    wo: "ChatGPT-App, Menü oben links **ChatGPT**, dann Umschalter **Work** oben auf der Seite; auf chatgpt.com und im Handy die Auswahl **Work**"
    bild: "chatgpt-app-work"

  # KI und Agenten ------------------------------------------------------------

  - term: "Agent"
    aliases: ["Agenten", "KI-Agent"]
    gruppe: "KI und Agenten"
    uebersetzt: "«Agent», «KI-Agent»"
    kurz: "KI, die in Schritten arbeitet: lesen, ändern, prüfen, weiter"
    bedeutung: "Ein Agent ist ein Sprachmodell mit Werkzeugen, das in einer Schleife arbeitet: Es tut etwas, schaut sich das Ergebnis an, entscheidet den nächsten Schritt und macht weiter, bis die Aufgabe erledigt ist oder es dich braucht. Claude Code, Cowork, Codex und ChatGPT Work sind Agenten. Eine einzelne Frage mit Antwort ist keiner, weil dazwischen nichts passiert."

  - term: "Sandbox"
    aliases: ["Sandkasten"]
    gruppe: "KI und Agenten"
    uebersetzt: "«Sandkasten», «Sandbox», «isolierte Umgebung»"
    kurz: "abgeschirmter Bereich, in dem ein Agent Befehle ausführt"
    bedeutung: "Eine Sandbox ist ein abgeschirmter Bereich, in dem ein Agent Befehle ausführt, damit ein Fehler nicht den Rest deines Computers erreicht. Cowork und ChatGPT Work führen Befehle in einer solchen Umgebung aus, Codex ebenfalls. Git schützt dich auf andere Art: Es hält den Agenten nicht vom Ändern ab, aber es zeigt dir jede Änderung und lässt dich zurück."

  - term: "Cloud"
    gruppe: "KI und Agenten"
    uebersetzt: "«Cloud», selten «Wolke»"
    kurz: "Rechner des Anbieters statt dein Laptop"
    bedeutung: "Cloud heisst: Die Arbeit läuft auf Rechnern des Anbieters, nicht auf deinem Laptop. Cowork und ChatGPT Work im Web laufen so, Claude Code und Codex wahlweise. Was in der Cloud läuft, sieht deine Dateien nur, wenn du sie verbindest oder hochlädst. Dein Repository auf GitHub liegt ebenfalls in der Cloud, auf Rechnern von GitHub."

  - term: "Permission"
    aliases: ["Permissions", "Approval", "Freigabe"]
    gruppe: "KI und Agenten"
    uebersetzt: "«Berechtigung», «Erlaubnis», «Genehmigung», «Freigabe»"
    kurz: "die Rückfrage des Agenten, bevor er etwas ändert"
    bedeutung: "Eine Permission ist die Rückfrage eines Agenten, bevor er etwas tut, das Folgen hat: eine Datei schreiben, einen Befehl ausführen, einen Commit machen. Das ist dein Moment der Entscheidung. Lies, was vorgeschlagen wird, bevor du zustimmst. Claude Code nennt die Stufen **Manual**, **Accept edits**, **Auto** und **Plan**; Codex spricht von Approvals."
    wo: "im Fenster des Agenten, als Frage mit Zustimmen und Ablehnen"

  - term: "CLAUDE.md"
    aliases: [".claude", "Ordner .claude"]
    gruppe: "KI und Agenten"
    kurz: "Anweisungen an Claude Code, als Datei im Repository"
    bedeutung: "`CLAUDE.md` ist eine Textdatei im Repository, die Claude Code zu Beginn jeder Sitzung liest: Regeln, Abläufe, was es lassen soll. Sie liegt im Hauptordner oder im Ordner `.claude`, in dem auch Einstellungen und Skills stehen. Claude Code im Terminal und in der Claude-App lesen dieselben Dateien. Cowork liest Skills und Plugins nicht aus dem Ordner `~/.claude`. Codex liest stattdessen `AGENTS.md`. Der Ordner `.claude` ist Thema des Folgeworkshops, nicht dieses Kurses."
    wo: "in deinem Ordner als Datei `CLAUDE.md`; auf github.com in der Dateiliste"

  - term: "AGENTS.md"
    gruppe: "KI und Agenten"
    kurz: "Anweisungen an Codex, als Datei im Repository"
    bedeutung: "`AGENTS.md` ist das Gegenstück zu `CLAUDE.md` für Codex: eine Textdatei im Repository, die Codex vor jeder Arbeit liest. Claude Code liest `AGENTS.md` ebenfalls, wenn es kein `CLAUDE.md` gibt. Codex liest `CLAUDE.md` nicht, ausser du stellst es ein."
    wo: "in deinem Ordner als Datei `AGENTS.md`; auf github.com in der Dateiliste"

